<!-- Update Banner Partial — served by /partials/update-banner, loaded on every page -->
{% if needs_update %}
<div id="update-banner"
     class="flex items-center justify-between px-6 py-2.5 bg-warning-50/40 dark:bg-warning-950/30 border-b border-warning-200 dark:border-warning-800/40 text-default-font text-caption">
    <div class="flex items-center gap-3">
        <i data-lucide="arrow-up-circle" class="w-5 h-5 text-warning-600 dark:text-warning-400"></i>
        <div>
            <span class="font-semibold text-default-font">Update {{ latest }} available</span>
            <span class="text-subtext-color mx-2">·</span>
            <span class="text-subtext-color text-[11px]">You are running {{ current }}</span>
        </div>
    </div>
    <div class="flex items-center gap-2">
        <button hx-post="/action/update/run"
                hx-target="#update-banner"
                hx-swap="outerHTML"
                hx-confirm="Update to {{ latest }}? The platform will restart. Continue?"
                class="btn-primary text-xs py-1 px-3 whitespace-nowrap inline-flex items-center gap-1.5">
            <i data-lucide="arrow-up-circle" class="w-3.5 h-3.5"></i> Update Now
        </button>
        <button hx-post="/action/update/postpone"
                hx-target="#update-banner"
                hx-swap="outerHTML"
                hx-vals='{"hours": "24"}'
                class="btn-outline text-xs py-1 px-3 whitespace-nowrap">
            Remind Later
        </button>
        <button hx-post="/action/update/postpone"
                hx-target="#update-banner"
                hx-swap="outerHTML"
                hx-vals='{"hours": "24"}'
                class="ml-1 text-subtext-color hover:text-default-font transition-colors p-1"
                title="Dismiss for 24h"><i data-lucide="x" class="w-4 h-4"></i></button>
    </div>
</div>
{% endif %}
