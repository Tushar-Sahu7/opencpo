<!-- Wizard content: step indicator + current step form -->
<div id="wizard-content">
    <div class="step-indicator flex gap-2 justify-center mb-6 flex-wrap items-center">
        {% for s in steps %}
        {% set state = steps_state.get(s, 'pending') %}
        <span class="inline-flex items-center gap-1 text-caption font-mono {% if state == 'done' %}text-success-600 dark:text-success-400 font-semibold{% elif state == 'skipped' %}text-subtext-color opacity-50{% elif s == step %}text-brand-600 dark:text-brand-400 font-bold{% else %}text-subtext-color{% endif %}">
            {% if state == 'done' %}<i data-lucide="check" class="w-3.5 h-3.5 inline"></i>{% elif state == 'skipped' %}—{% else %}{{ loop.index }}{% endif %}
            <span class="sr-only">{{ step_labels[s] }}</span>
        </span>
        {% if not loop.last %}<span class="text-neutral-border">·</span>{% endif %}
        {% endfor %}
    </div>

    <div id="setup-step">
        {% include '_setup_step.html' %}
    </div>
</div>
