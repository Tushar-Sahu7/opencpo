<div id="modal-partner-detail" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4">
  <div class="card p-6 w-full max-w-lg max-h-[90vh] overflow-y-auto shadow-2xl text-default-font">
    <div class="flex justify-between items-center mb-4 pb-3 border-b border-neutral-border">
      <h2 class="text-base font-semibold text-default-font">Edit Partner</h2>
      <button onclick="closeModal('modal-partner-detail')" class="text-subtext-color hover:text-default-font p-1 rounded inline-flex items-center justify-center"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>
    <form id="edit-partner-form" hx-target="#edit-partner-result" hx-swap="innerHTML" class="space-y-4">
      <div>
        <label class="block text-xs text-subtext-color mb-1">Name</label>
        <input id="edit-name" name="name" class="input w-full text-sm">
      </div>
      <div>
        <label class="block text-xs text-subtext-color mb-1">Versions URL</label>
        <input id="edit-url" name="url" type="url" class="input w-full text-sm font-mono">
      </div>
      <div>
        <label class="block text-xs text-subtext-color mb-1">Their Token</label>
        <input id="edit-token-b" name="token_b" placeholder="Leave blank to keep current" class="input w-full text-sm font-mono">
        <div class="text-[11px] text-subtext-color mt-1">Only fill in if updating — leave blank to keep the existing token.</div>
      </div>
      <div>
        <label class="block text-xs text-subtext-color mb-1">Status</label>
        <select id="edit-status" name="status" class="select w-full text-sm">
          <option value="">— keep current —</option>
          <option value="active">Active</option>
          <option value="pending">Pending</option>
          <option value="suspended">Suspended</option>
          <option value="disabled">Disabled</option>
        </select>
      </div>
      <div class="border-t border-neutral-border pt-4">
        <div class="text-xs text-subtext-color uppercase font-semibold tracking-wider mb-2">Roaming Tariff</div>
        <div class="mb-3">
          <label class="block text-xs text-subtext-color mb-1">Base Tariff</label>
          <select name="base_tariff_id" id="edit-base-tariff" onchange="updateEditPreview()" class="select w-full text-sm">
            <option value="">— All tariffs —</option>
            {% for t in tariffs %}
            <option value="{{ t.id }}" data-energy="{{ t.energy_rate or 0 }}" data-flat="{{ t.flat_fee or 0 }}" data-time="{{ t.time_rate or 0 }}">{{ t.name }} ({{ "%.4f"|format(t.energy_rate or 0) }} €/kWh)</option>
            {% endfor %}
          </select>
        </div>
        <div class="grid grid-cols-3 gap-2 mb-3">
          <div>
            <label class="block text-[11px] text-subtext-color mb-1">+ €/kWh</label>
            <input name="roaming_fee_kwh" type="number" step="0.0001" min="0" id="edit-fee-kwh" oninput="updateEditPreview()" class="input w-full text-sm font-mono">
          </div>
          <div>
            <label class="block text-[11px] text-subtext-color mb-1">+ Flat (€)</label>
            <input name="roaming_fee_flat" type="number" step="0.01" min="0" id="edit-fee-flat" oninput="updateEditPreview()" class="input w-full text-sm font-mono">
          </div>
          <div>
            <label class="block text-[11px] text-subtext-color mb-1">+ €/min</label>
            <input name="roaming_fee_time" type="number" step="0.0001" min="0" id="edit-fee-time" oninput="updateEditPreview()" class="input w-full text-sm font-mono">
          </div>
        </div>
        <div id="edit-tariff-preview" class="text-xs text-subtext-color bg-neutral-50 dark:bg-neutral-800/50 border border-neutral-border rounded p-2.5">—</div>
      </div>
      <div id="edit-partner-result" class="my-2"></div>
      <div class="flex gap-3 pt-2">
        <button id="btn-delete-partner" type="button" class="btn btn-outline text-error-600 border-error-200 dark:border-error-800 hover:bg-error-50 text-xs py-2 px-3">Remove</button>
        <div class="flex-1"></div>
        <button type="button" onclick="closeModal('modal-partner-detail')" class="btn btn-outline text-xs py-2 px-4">Cancel</button>
        <button type="submit" class="btn btn-primary text-xs py-2 px-4">Save</button>
      </div>
    </form>
  </div>
</div>
