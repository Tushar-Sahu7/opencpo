<!-- Backup & Restore Panel Partial — served by /partials/backup-panel -->
<div class="space-y-4">
    <!-- Status messages -->
    <div id="backup-status"></div>

    <!-- Create / Import buttons -->
    <div class="flex items-center gap-3 flex-wrap">
        <button hx-post="/action/backup/create"
                hx-target="#backup-status"
                hx-swap="innerHTML"
                hx-indicator="#backup-spinner"
                class="btn-primary text-caption py-2 px-4 inline-flex items-center gap-1.5">
            <i data-lucide="zap" class="w-4 h-4"></i>
            <span>Create Backup</span>
        </button>
        <span id="backup-spinner" class="htmx-indicator text-caption text-subtext-color">Creating...</span>

        <!-- Import backup file upload -->
        <form hx-post="/action/backup/upload"
              hx-target="#backup-status"
              hx-swap="innerHTML"
              hx-encoding="multipart/form-data"
              hx-indicator="#import-spinner"
              class="flex items-center gap-2">
            <input type="file" name="backup_file" accept=".zip,.tar.gz,.sql"
                   class="text-caption text-subtext-color file:mr-2.5 file:py-1 file:px-3 file:rounded-md file:border-0 file:text-caption file:btn-outline">
            <button type="submit"
                    class="btn-outline text-caption py-1.5 px-3 whitespace-nowrap">
                Import
            </button>
        </form>
        <span id="import-spinner" class="htmx-indicator text-caption text-subtext-color">Uploading...</span>
    </div>

    <!-- Backups list -->
    {% if backups %}
    <div class="overflow-x-auto">
        <table class="w-full text-caption">
            <thead>
                <tr class="text-subtext-color text-[10px] font-semibold uppercase tracking-wider border-b border-neutral-border">
                    <th class="text-left py-2 pr-4">Filename</th>
                    <th class="text-left py-2 pr-4">Size</th>
                    <th class="text-left py-2 pr-4">Date</th>
                    <th class="text-right py-2">Actions</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-neutral-border">
                {% for b in backups %}
                <tr class="hover:bg-neutral-50 dark:hover:bg-neutral-800/40 transition-colors">
                    <td class="py-2.5 pr-4 font-mono text-[11px] text-default-font">{{ b.filename }}</td>
                    <td class="py-2.5 pr-4 text-subtext-color">{{ b.size }}</td>
                    <td class="py-2.5 pr-4 text-subtext-color font-mono">{{ b.date|format_datetime }}</td>
                    <td class="py-2.5 text-right">
                        <div class="flex items-center justify-end gap-1.5">
                            <button hx-post="/action/backup/restore"
                                    hx-target="#backup-status"
                                    hx-swap="innerHTML"
                                    hx-vals='{"backup_id": "{{ b.id }}"}'
                                    hx-confirm="Restore backup '{{ b.filename }}'? This will overwrite current data. Continue?"
                                    class="btn-outline text-[11px] py-1 px-2.5 text-warning-600 dark:text-warning-400">
                                Restore
                            </button>
                            <button hx-post="/action/backup/delete/{{ b.id }}"
                                    hx-target="#backup-panel"
                                    hx-swap="outerHTML"
                                    hx-confirm="Delete backup '{{ b.filename }}'? This cannot be undone."
                                    class="btn-outline text-[11px] py-1 px-2.5 text-error-600 dark:text-error-400">
                                Delete
                            </button>
                        </div>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    {% else %}
    <div class="text-caption text-subtext-color py-6 text-center border border-dashed border-neutral-border rounded-lg">
        No backups yet. Create your first backup to secure your data.
    </div>
    {% endif %}
</div>
