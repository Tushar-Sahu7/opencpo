{% for cp in chargers %}
<tr class="border-b border-neutral-border hover:bg-neutral-100 dark:hover:bg-neutral-800 transition-colors" id="row-{{ cp.id }}">
    <td class="p-3 font-mono font-bold">
        <a href="/remote/{{ cp.id }}" class="text-brand-600 dark:text-brand-400 hover:underline">{{ cp.id }}</a>
        {% if cp.simulated %}<span class="badge badge-warning ml-1">SIM</span>{% endif %}
    </td>
    <td class="p-3 text-default-font font-medium">{{ cp.vendor }}</td>
    <td class="p-3 text-subtext-color">{{ cp.model }}</td>
    <td class="p-3 font-mono text-xs text-subtext-color">{{ cp.serial_number or '—' }}</td>
    <td class="p-3 text-xs text-subtext-color">{{ cp.firmware_version or '—' }}</td>
    <td class="p-3 text-subtext-color">{{ cp.ocpp_version }}</td>
    <td class="p-3">
        <span class="badge {% if cp.status == 'online' %}badge-success{% else %}badge-error{% endif %}">
            <span class="status-dot {% if cp.status == 'online' %}status-dot-green animate-pulse{% else %}status-dot-red{% endif %}"></span>
            {{ cp.status|upper }}
        </span>
    </td>
    <td class="p-3 text-subtext-color">{{ cp.site or '—' }}</td>
    <td class="p-3 text-subtext-color text-xs font-mono">{{ cp.last_boot|format_datetime }}</td>
    <td class="p-3 text-right">
        <div class="inline-flex items-center gap-1 justify-end">
            <button type="button"
                    onclick="viewChargerDetails(this, event)"
                    data-id="{{ cp.id }}"
                    data-vendor="{{ cp.vendor }}"
                    data-model="{{ cp.model }}"
                    data-serial="{{ cp.serial_number or '' }}"
                    data-firmware="{{ cp.firmware_version or '' }}"
                    data-ocpp="{{ cp.ocpp_version }}"
                    data-site="{{ cp.site or '' }}"
                    data-status="{{ cp.status }}"
                    data-last-boot="{{ cp.last_boot|format_datetime if cp.last_boot else '' }}"
                    data-simulated="{{ 'true' if cp.simulated else 'false' }}"
                    data-display-name="{{ cp.display_name or '' }}"
                    class="action-btn btn-press" title="View charger details">
                <i data-lucide="eye" class="w-3.5 h-3.5 pointer-events-none"></i>
            </button>
            <button type="button"
                    onclick="editCharger(this, event)"
                    data-id="{{ cp.id }}"
                    data-vendor="{{ cp.vendor }}"
                    data-model="{{ cp.model }}"
                    data-serial="{{ cp.serial_number or '' }}"
                    data-ocpp="{{ cp.ocpp_version }}"
                    data-site="{{ cp.site or '' }}"
                    data-display-name="{{ cp.display_name or '' }}"
                    class="action-btn btn-press" title="Edit charger details">
                <i data-lucide="pencil" class="w-3.5 h-3.5 pointer-events-none"></i>
            </button>
            <button hx-post="/action/reset/{{ cp.id }}" hx-swap="outerHTML" title="Reset — reboot the charger"
                    class="action-btn action-btn-accent btn-press"><i data-lucide="rotate-ccw" class="w-3.5 h-3.5 pointer-events-none"></i></button>
            <button type="button" onclick="confirmDelete('{{ cp.id }}', event)"
                    class="action-btn action-btn-danger btn-press" title="Delete this charger"><i data-lucide="trash-2" class="w-3.5 h-3.5 pointer-events-none"></i></button>
        </div>
    </td>
</tr>
{% endfor %}
