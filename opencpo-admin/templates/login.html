    <!-- Instant Theme Resolver -->
    <script>
        (function() {
            try {
                const savedTheme = localStorage.getItem('opencpo_theme');
                if (savedTheme === 'dark') {
                    document.documentElement.classList.add('dark');
                } else if (savedTheme === 'light') {
                    document.documentElement.classList.remove('dark');
                }
            } catch (e) {}
        })();
    </script>

    <style>
        body { background: var(--color-bg-app); color: var(--color-text-primary); font-family: var(--font-sans); }

        .login-card {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-modal);
            box-shadow: var(--shadow-modal);
        }

        .input-field {
            background: var(--color-surface);
            border: 1px solid var(--color-border-input);
            border-radius: var(--radius-control);
            color: var(--color-text-primary);
            font-size: var(--text-sm);
            padding: 9px 12px;
            width: 100%;
            outline: none;
            transition: border-color var(--duration-fast) var(--ease-out), box-shadow var(--duration-fast) var(--ease-out);
        }
        .input-field::placeholder { color: var(--color-text-subtle); }
        .input-field:focus {
            border-color: var(--color-border-focus);
            background: var(--color-surface);
            box-shadow: 0 0 0 2px rgba(37,99,235,0.18);
        }

        .btn-login {
            background: var(--color-action-primary);
            color: #fff;
            border: none;
            border-radius: var(--radius-control);
            font-size: var(--text-sm);
            font-weight: 600;
            padding: 10px 0;
            width: 100%;
            cursor: pointer;
            letter-spacing: 0.2px;
            transition: background var(--duration-fast) var(--ease-out), box-shadow var(--duration-fast) var(--ease-out), transform var(--duration-press) var(--ease-out);
        }
        .btn-login:hover {
            background: var(--color-action-primary-hover);
            box-shadow: 0 4px 14px rgba(37,99,235,0.28);
        }
        .btn-login:active {
            background: var(--color-action-primary-active);
            transform: scale(0.98);
        }

        label { font-size: var(--text-xs); color: var(--color-text-secondary); letter-spacing: 0.3px; }
    </style>
</head>
<body class="h-full flex flex-col items-center justify-center" style="min-height:100vh;">

    <!-- Logo bar at top -->
    <div style="margin-bottom:36px;text-align:center;">
        <div style="font-size:32px;font-weight:700;letter-spacing:-0.5px;line-height:1;">
            <img src="/static/logo.png" alt="ChargeQ" width="200">
        </div>
        <div style="font-size:10px;color:#64748b;letter-spacing:2.5px;text-transform:uppercase;margin-top:8px;">
            Admin Panel
        </div>
    </div>

    <!-- Login card -->
    <div class="login-card" style="width:100%;max-width:380px;padding:36px 32px;">

        <h1 style="font-size:17px;font-weight:600;color:var(--color-default-font);margin-bottom:24px;">Sign in</h1>

        <!-- Error message -->
        {% if error %}
        <div style="background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);border-radius:7px;padding:10px 14px;margin-bottom:20px;font-size:13px;color:#f87171;">
            {{ error }}
        </div>
        {% endif %}

        <form method="post" action="/login" autocomplete="on">
            <div style="margin-bottom:18px;">
                <label for="email" style="display:block;margin-bottom:6px;">Email</label>
                <input
                    id="email"
                    name="email"
                    type="email"
                    class="input-field"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                    autofocus
                >
            </div>

            <div style="margin-bottom:28px;">
                <label for="password" style="display:block;margin-bottom:6px;">Password</label>
                <input
                    id="password"
                    name="password"
                    type="password"
                    class="input-field"
                    placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit" class="btn-login">Sign in</button>
        </form>
    </div>

    <!-- Footer -->
    <div style="margin-top:32px;font-size:12px;color:var(--color-text-muted);text-align:center;">
        Powered by <span style="color:var(--color-text-secondary);font-weight:600;">ChargeQ</span>
    </div>
    <!-- <div style="margin-top:32px;font-size:12px;color:var(--color-text-muted);text-align:center;">Made with ❤️ by Gaurav Singh</div> -->
