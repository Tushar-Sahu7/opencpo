{% extends "base.html" %}
{% block title %}{{ t.error | default('Error') }}{% endblock %}
{% block content %}
<div class="screen active" style="display:flex;align-items:center;justify-content:center;min-height:80vh;">
  <div style="text-align:center;max-width:360px;padding:24px;">
    <div style="font-size:48px;margin-bottom:16px;">⚠️</div>
    <h1 style="font-size:20px;font-weight:700;color:var(--text1);margin-bottom:8px;">
      {{ message | default(t.error | default('Something went wrong')) }}
    </h1>
    {% if detail %}
      <p style="font-size:13px;color:var(--text3);margin-bottom:20px;">{{ detail }}</p>
    {% endif %}
    <a href="/" class="btn btn-primary" style="display:inline-block;text-decoration:none;">
      {{ t.back_home | default('Back to map') }}
    </a>
  </div>
</div>
{% endblock %}
