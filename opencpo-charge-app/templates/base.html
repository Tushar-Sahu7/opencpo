<!DOCTYPE html>
<html lang="{{ lang | default('nl') }}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#00B0E4" />
  <link rel="manifest" href="/static/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <title>{% block title %}{{ t.app_name | default(app_title) }}{% endblock %}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/skin/style.css" />
  <link rel="stylesheet" href="/static/leaflet.css" />
  <script src="/static/leaflet.js"></script>
  <script src="/static/htmx.min.js" defer></script>
  <script>window.FEATURES = {{ flags | tojson if flags is defined else '{}' }};</script>
</head>
<body>
  <div id="app" style="padding-bottom:70px;">
    {% block content %}{% endblock %}
  </div>

  <nav id="app-nav" style="position:fixed;bottom:0;left:0;right:0;z-index:1000;display:flex;align-items:center;justify-content:space-around;background:var(--bg2,#0d2137);border-top:1px solid var(--border,#1e3a5f);padding:8px 0 max(8px,env(safe-area-inset-bottom));">
    <a href="/" id="nav-map" style="display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--text3,#64748b);padding:4px 16px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/></svg>
      <span style="font-size:11px;">{{ t.tab_map | default('Map') }}</span>
    </a>
    <a href="/#scan" id="nav-scan" style="display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--text3,#64748b);padding:4px 16px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7"/></svg>
      <span style="font-size:11px;">{{ t.tab_scan | default('Scan') }}</span>
    </a>
    <a href="{% if account is defined and account %}/account/profile{% elif flags is defined and flags.get('account_login') %}/account/login{% else %}/account/settings{% endif %}" id="nav-account" style="display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--text3,#64748b);padding:4px 16px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0112 0v1"/></svg>
      <span style="font-size:11px;">{{ t.tab_account | default('Account') }}</span>
    </a>
  </nav>
  <script>(function(){var p=location.pathname,a='nav-map';if(p.startsWith('/account'))a='nav-account';var e=document.getElementById(a);if(e)e.style.color='var(--accent,#00B0E4)';})()</script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/static/sw.js').catch(() => {});
    }
  </script>
</body>
</html>
